[project]
name = "surrogate-optimization"
version = "0.1.0"
description = "Reproducible mixer-reactor-clarifier activated-sludge optimization with a physically constrained statistical surrogate."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "casadi==3.7.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "osqp>=1.0.0",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "threadpoolctl>=3.6.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
